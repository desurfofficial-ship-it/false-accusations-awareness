<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" preserveAspectRatio="xMidYMid slice">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="overlay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.15"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#f8fafc" opacity="0.18"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#dots)"/>
  <rect width="800" height="500" fill="url(#overlay)"/>

  <g font-family="Inter, 'Helvetica Neue', Arial, sans-serif" fill="#f8fafc">
    <text x="40" y="62" font-size="22" font-weight="700" letter-spacing="3" opacity="0.85">AUSTRALIA</text>
    <text x="40" y="92" font-size="48" font-weight="800" letter-spacing="-1">1994</text>
    <text x="40" y="468" font-size="11" font-weight="600" letter-spacing="2.5" opacity="0.65">CASE FILE · ANDREW-MALLARD</text>
  </g>

  <g transform="translate(400,260)" stroke="#f8fafc" stroke-width="3" fill="none" opacity="0.9">
    <circle cx="-50" cy="0" r="40" fill="#f8fafc" fill-opacity="0.18"/>
    <circle cx="50" cy="0" r="40" fill="#f8fafc" fill-opacity="0.18"/>
    <line x1="-15" y1="-25" x2="15" y2="-25"/>
    <line x1="-15" y1="25" x2="15" y2="25"/>
    <circle cx="-50" cy="0" r="6" fill="#0f172a"/>
    <circle cx="50" cy="0" r="6" fill="#0f172a"/>
  </g>

  <g transform="translate(560,410)" fill="#f8fafc" opacity="0.92">
    <!-- The Accused (tallest, center) -->
    <g transform="translate(40,0)">
      <circle cx="0" cy="-65" r="11"/>
      <path d="M -15 -52 Q -15 -28 0 -28 Q 15 -28 15 -52 L 15 -8 L -15 -8 Z"/>
      <text x="0" y="14" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="8.5" font-weight="700" letter-spacing="1.2" fill="#f8fafc" opacity="0.85">ACCUSED</text>
    </g>
    <!-- The Accuser (smaller, left) -->
    <g transform="translate(0,5)" opacity="0.65">
      <circle cx="0" cy="-55" r="9"/>
      <path d="M -12 -44 Q -12 -22 0 -22 Q 12 -22 12 -44 L 12 -5 L -12 -5 Z"/>
      <text x="0" y="14" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="8.5" font-weight="700" letter-spacing="1.2" fill="#f8fafc" opacity="0.85">ACCUSER</text>
    </g>
    <!-- The Amplifiers (multiple, right) -->
    <g transform="translate(95,8)" opacity="0.55">
      <circle cx="0" cy="-50" r="7"/>
      <path d="M -10 -40 Q -10 -20 0 -20 Q 10 -20 10 -40 L 10 -5 L -10 -5 Z"/>
      <circle cx="14" cy="-48" r="6" opacity="0.7"/>
      <path d="M 6 -38 Q 6 -20 14 -20 Q 22 -20 22 -38 L 22 -5 L 6 -5 Z" opacity="0.7"/>
      <text x="7" y="14" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="8.5" font-weight="700" letter-spacing="1.2" fill="#f8fafc" opacity="0.85">AMPLIFIERS</text>
    </g>
  </g>

</svg>
