<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" preserveAspectRatio="xMidYMid slice">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#f8fafc" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="overlay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.15"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1e3a8a" opacity="0.18"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#dots)"/>
  <rect width="800" height="500" fill="url(#overlay)"/>

  <g font-family="Inter, 'Helvetica Neue', Arial, sans-serif" fill="#1e3a8a">
    <text x="40" y="62" font-size="22" font-weight="700" letter-spacing="3" opacity="0.85">CANADA</text>
    <text x="40" y="92" font-size="48" font-weight="800" letter-spacing="-1">1984</text>
    <text x="40" y="468" font-size="11" font-weight="600" letter-spacing="2.5" opacity="0.65">CASE FILE · GUY-PAUL-MORIN</text>
  </g>

  <g transform="translate(400,260)" stroke="#f8fafc" stroke-width="3" fill="none" opacity="0.9">
    <path d="M -60 -80 C 60 -40, -60 40, 60 80"/>
    <path d="M 60 -80 C -60 -40, 60 40, -60 80"/>
    <line x1="-46" y1="-58" x2="46" y2="-58"/>
    <line x1="-46" y1="-22" x2="46" y2="-22"/>
    <line x1="-46" y1="22" x2="46" y2="22"/>
    <line x1="-46" y1="58" x2="46" y2="58"/>
  </g>

</svg>
