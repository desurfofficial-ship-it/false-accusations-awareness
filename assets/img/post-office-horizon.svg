<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" preserveAspectRatio="xMidYMid slice">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="overlay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.15"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#f8fafc" opacity="0.18"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#dots)"/>
  <rect width="800" height="500" fill="url(#overlay)"/>

  <g font-family="Inter, 'Helvetica Neue', Arial, sans-serif" fill="#f8fafc">
    <text x="40" y="62" font-size="22" font-weight="700" letter-spacing="3" opacity="0.85">UK</text>
    <text x="40" y="92" font-size="48" font-weight="800" letter-spacing="-1">1999</text>
    <text x="40" y="468" font-size="11" font-weight="600" letter-spacing="2.5" opacity="0.65">CASE FILE · POST-OFFICE-HORIZON</text>
  </g>

  <g transform="translate(400,260)" stroke="#f8fafc" stroke-width="3" fill="#f8fafc" fill-opacity="0.18" opacity="0.9">
    <rect x="-110" y="-60" width="220" height="140" rx="6"/>
    <path d="M -110 -60 L 0 20 L 110 -60" fill="none" stroke="#f8fafc" stroke-width="4"/>
    <line x1="-110" y1="80" x2="110" y2="-60" stroke="#dc2626" stroke-width="6" opacity="0.9"/>
  </g>

</svg>
