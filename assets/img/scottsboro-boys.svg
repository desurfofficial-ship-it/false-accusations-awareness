<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" preserveAspectRatio="xMidYMid slice">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="overlay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.15"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#f8fafc" opacity="0.18"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#dots)"/>
  <rect width="800" height="500" fill="url(#overlay)"/>

  <g font-family="Inter, 'Helvetica Neue', Arial, sans-serif" fill="#f8fafc">
    <text x="40" y="62" font-size="22" font-weight="700" letter-spacing="3" opacity="0.85">USA</text>
    <text x="40" y="92" font-size="48" font-weight="800" letter-spacing="-1">1931</text>
    <text x="40" y="468" font-size="11" font-weight="600" letter-spacing="2.5" opacity="0.65">CASE FILE · SCOTTSBORO-BOYS</text>
  </g>

  <g transform="translate(400,270)" stroke="#f8fafc" stroke-width="3" fill="#f8fafc" fill-opacity="0.2" opacity="0.9">
    <rect x="-130" y="-50" width="260" height="60" rx="8"/>
    <rect x="-110" y="-40" width="40" height="25" fill="#0f172a" stroke="#f8fafc"/>
    <rect x="-50" y="-40" width="40" height="25" fill="#0f172a" stroke="#f8fafc"/>
    <rect x="10" y="-40" width="40" height="25" fill="#0f172a" stroke="#f8fafc"/>
    <rect x="70" y="-40" width="40" height="25" fill="#0f172a" stroke="#f8fafc"/>
    <circle cx="-90" cy="20" r="12" fill="#0f172a"/>
    <circle cx="-30" cy="20" r="12" fill="#0f172a"/>
    <circle cx="30" cy="20" r="12" fill="#0f172a"/>
    <circle cx="90" cy="20" r="12" fill="#0f172a"/>
  </g>

</svg>
